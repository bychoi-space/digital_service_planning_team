<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="topLayerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="midLayerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="botLayerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 베이스 라운드 스퀘어 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad3)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- 3차원 서비스 계층 스택 (Service Architecture Stack) -->
  <g filter="url(#layerShadow)">
    <!-- 1층 (하단: 데이터 및 인프라 기반 레이어) -->
    <!-- 상면 -->
    <polygon points="32,36 50,44 32,52 14,44" fill="url(#botLayerGrad)"/>
    <!-- 전면 좌측/우측 두께 -->
    <polygon points="14,44 32,52 32,54.5 14,46.5" fill="#1E293B"/>
    <polygon points="50,44 32,52 32,54.5 50,46.5" fill="#0F172A"/>

    <!-- 2층 (중간: 서비스 정책 및 비즈니스 로직 레이어) -->
    <!-- 상면 -->
    <polygon points="32,24 50,32 32,40 14,32" fill="url(#midLayerGrad)"/>
    <!-- 전면 두께 -->
    <polygon points="14,32 32,40 32,42.5 14,34.5" fill="#3730A3"/>
    <polygon points="50,32 32,40 32,42.5 50,34.5" fill="#312E81"/>

    <!-- 3층 (상단: 기획 설계 & UX 인터페이스 레이어) -->
    <!-- 상면 -->
    <polygon points="32,12 50,20 32,28 14,20" fill="url(#topLayerGrad)"/>
    <!-- 상단 와이어프레임 그리드 라인 -->
    <line x1="23" y1="16" x2="41" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="41" y1="16" x2="23" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="32" cy="20" r="2.2" fill="#FFFFFF"/>
    <!-- 전면 두께 -->
    <polygon points="14,20 32,28 32,30.5 14,22.5" fill="#0369A1"/>
    <polygon points="50,20 32,28 32,30.5 50,22.5" fill="#0C4A6E"/>
  </g>
</svg>
